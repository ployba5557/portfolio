<!DOCTYPE html>
<html lang="th">
<head>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts: Freehand & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Freehand&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

<body class="overflow-x-hidden">

    <!-- 1. พื้นหลัง Mesh Gradient -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">

            <div class="anim-vec1 absolute bg-[rgba(138,183,228,0.7)] transition-all"></div>
            <div class="anim-vec2 absolute bg-[rgba(35,223,173,0.7)] transition-all"></div>

    <div class="absolute w-full max-w-[1440px] left-1/2 -translate-x-1/2 top-[134px] px-4 flex flex-col items-center gap-[32px] md:gap-[48px] z-20">

        <div class="flex flex-col items-center gap-[72px]">

                <!-- ชื่อ Pornpailin Phimprao -->

                        Pornpailin

                    <span class="w-[26px] h-[48px] font-inter font-bold text-[40px] leading-[48px] text-center text-name-color flex-none letter-p">P</span>
                    <span class="w-[32px] h-[48px] font-inter font-bold text-[40px] leading-[48px] text-center text-name-color flex-none letter-o1">O</span>
                    <span class="w-[27px] h-[48px] font-inter font-bold text-[40px] leading-[48px] text-center text-name-color flex-none letter-r">R</span>
                    <span class="w-[27px] h-[48px] font-inter font-bold text-[40px] leading-[48px] text-center text-name-color flex-none letter-t">T</span>
                    <span class="w-[24px] h-[48px] font-inter font-bold text-[40px] leading-[48px] text-center text-name-color flex-none letter-f">F</span>
                    <span class="w-[32px] h-[48px] font-inter font-bold text-[40px] leading-[48px] text-center text-name-color flex-none letter-o2">O</span>
                    <span class="w-[23px] h-[48px] font-inter font-bold text-[40px] leading-[48px] text-center text-name-color flex-none letter-l">L</span>
                    <span class="w-[12px] h-[48px] font-inter font-bold text-[40px] leading-[48px] text-center text-name-color flex-none letter-i">I</span>
                    <span class="w-[32px] h-[48px] font-inter font-bold text-[40px] leading-[48px] text-center text-name-color flex-none letter-o3">O</span>
                </div>

            </div>
        </div>

        <!-- Frame 12: เรียงตามลำดับ Flex Column (ปรับลดระยะห่างระหว่าง PORTFOLIO กับรูปภาพลง) -->
        <div class="flex flex-col items-center gap-[16px] md:gap-[24px] mt-[-20px] md:mt-[0px]">
            
            <!-- 1. รูปโปรไฟล์ -->
            <div class="w-[147px] h-[195px] bg-[#222] rounded-[40px] overflow-hidden border border-white/20 shadow-xl shrink-0 animate-profile-entrance">

                <div class="w-full h-full bg-[rgba(107,107,107,0.2)] group-hover:bg-[rgba(127,127,127,0.1)] flex flex-row justify-center items-center px-[20px] py-[10px] gap-[10px] backdrop-blur-md relative z-10 transition-all duration-500 group-hover:justify-between group-hover:px-[16px]">

                        <svg class="w-full h-full fill-[#FFFFFF]" viewBox="0 0 24 24">
                            <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                        </svg>
                    </div>
                </div>

</body>
</html>
